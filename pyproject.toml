[project]
name = "agentops-poc"
version = "0.6.0"
description = "Streaming DeepAgents service with independent Langfuse evaluations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.6.2",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-openai==1.8.0",
    "langfuse==4.16.0",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false
cache-dir = "data/uv-cache"
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "artifacts", "logs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "artifacts"]
